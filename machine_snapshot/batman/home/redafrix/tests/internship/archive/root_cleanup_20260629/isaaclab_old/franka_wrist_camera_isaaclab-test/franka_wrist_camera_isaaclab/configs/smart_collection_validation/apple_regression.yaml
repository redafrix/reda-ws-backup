task: pick_place
output_dir: /home/redafrix/tests/internship/franka_wrist_camera_isaaclab-test/outputs/apple_regression_smart
start_episode_id: 0
num_episodes: 1
max_steps: 4800
settle_time_s: 1.0

record_cameras: true
camera_fps: 30
record_depth: true

seed: 123
top_grasp_depth_m: 0.045

collection_policy:
  require_real_receptacle: false
  reject_unknown_objects: true
  reject_unknown_pairs: false

preflight:
  gripper_width_safety_margin_m: 0.008
  receptacle_xy_clearance_m: 0.012
  receptacle_wall_clearance_m: 0.010
  approach_clearance_m: 0.010
  max_object_mass_kg: 0.8
  max_object_height_m: 0.22

target_object:
  catalog_config: object_catalog.generated.yaml
  geometry_config: object_geometry.generated.yaml
  category_id: apple
  variant_id: apple01
  split: train
  role: target
  required_affordances: [pickable]
  required_grasp_strategy: center_top

pose_randomization:
  object_xy_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
  place_xy_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]

lighting_randomization:
  dome_light_intensity_range: [800.0, 800.0]
  dome_light_color_options:
    - [1.0, 1.0, 1.0]
